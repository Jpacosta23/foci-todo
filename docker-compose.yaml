services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: foci_todo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/foci_todo
      PORT: 3005
    ports:
      - "3005:3005"
    depends_on:
      - db

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_URL: http://localhost:3005
    ports:
      - "5174:4173"
    depends_on:
      - api

volumes:
  postgres-data: